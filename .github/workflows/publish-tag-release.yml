name: Publish annotated tags

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated tag to publish
        required: true
        default: v7.0

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub release
        uses: actions/github-script@v7
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        with:
          github-token: ${{ github.token }}
          script: |
            const tag = context.ref.startsWith("refs/tags/")
              ? context.ref.slice("refs/tags/".length)
              : (process.env.REQUESTED_TAG || "v7.0");

            const releases = {
              "v1.0": {
                name: "v1.0 — A2A + O-projection",
                body: [
                  "首个固化的 A2A + O-projection 版本。",
                  "",
                  "核心优化：运行时根据 problem shape 与通信 CTA 预算，在已验证 policy 中自动选择 tile，均衡 GEMM waves，避免 Golden shape 上的 wave-cliff 尾波。",
                  "",
                  "v1.0 的优化范围是 A2A + OProj；QKVProj + A2A 与 MegaMoE 不属于本版本的性能承诺。",
                ].join("\n"),
              },
              "v2.0": {
                name: "v2.0 — A2A + O-projection",
                body: [
                  "第二个固化的 A2A + O-projection 版本。",
                  "",
                  "核心优化：GEMM wave 按 compute cluster 计数并对齐 N frontier，加入 `M128N320 cluster-M2` 与窄 peer shard 的约 8 KiB 3D TMA store；生产入口根据 M、CP、N 和 NVLink 带宽自动选择 `comm4/6/8`。",
                  "",
                  "🩵 **相对 v1.0，v2.0 在 25/36 个 case 上更快，36 点延迟比几何平均为 1.089×。** 完整 36-case 表在 `BENCHMARK.md` 现有主表中增加了 `v1 p50 / v1→v2` 列，没有另建表。",
                  "",
                  "36/36 case 快于调优后的 TE+NCCL/cuBLASLt+NCCL 最强分离基线，29/36 快于 TE Userbuffers，相对 TE Userbuffers 几何平均 1.110×。",
                  "",
                  "生产入口保持 `--comm-ctas 0 --lhs-policy auto --raster n --swizzle 1`。实验性全量成本模型可用 `FUSE_A2A_LHS_COMM_POLICY=experimental_model` 开启，默认关闭。",
                  "",
                  "v2.0 的优化范围仍是 A2A + OProj；QKVProj + A2A 与 MegaMoE 不属于本版本已收口的性能承诺。",
                ].join("\n"),
              },
              "v3.0": {
                name: "v3.0 — A2A + O-projection",
                body: [
                  "第三个固化的 A2A + O-projection 版本。",
                  "",
                  "v3.0 固定 v2.0 的核心 kernel 与自动 tile 策略，只把外部 `comm_ctas` 作为唯一标定变量；`--lhs-policy auto --raster n --swizzle 1` 始终不变。",
                  "",
                  "🩵 **相对 v2.0，7 个原 TE Userbuffers 落后点全部翻转；与其余 29 个 v2 setting 合并后，36/36 个 p50 领先 TE Userbuffers，36 点几何平均为 1.154×。**",
                  "",
                  "这项 36/36 结论明确包含 per-shape 手工 `comm_ctas` winner，不代表默认 `--comm-ctas 0` 零调参即可取得同样结果。默认自动入口仍是通用生产配置。",
                  "",
                  "正式口径为 BF16、10 warmup + 50 samples、每个 sample 先取跨 rank 最大延迟再统计 p50。CP4 `256×7168×16384` 的 p50 领先 TE，但 p95 仍略慢，发布结论不扩展到尾延迟。",
                  "",
                  "`BENCHMARK.md` 已完整列出36个 v3.0 setting，并在同一行保留 v2→v3 对照；`results/a2a-Oproj/oproj_v3_manual_comm_bench` 保存完整36点机器可读归档，其中7个 `manual_comm_ctas` 行有明确标记。",
                  "",
                  "v3.0 的性能承诺仍只覆盖 A2A + OProj；QKVProj + A2A 与 MegaMoE 不在本版本收口范围。",
                ].join("\n"),
              },
              "v4.0": {
                name: "v4.0 — benchmark and tuning release",
                body: [
                  "v4.0 收口 benchmark、外部调参和真实模型 shape；核心算子优化仍以 A2A + O-projection 为主，QKV Projection + A2A 的性能优化留到 v5。",
                  "",
                  "A2A + OProj 扩展到 96 个 CP4/CP8 setting，包含代表 shape、生产 Qwen、Nanbeige4.2-3B、Llama 3、Qwen2.5 与 Llama 3.1 405B；按完整标定结果，p50 在 95/96 个 setting 领先调优后的 TE Userbuffers，Nanbeige4.2-3B 为 12/12。",
                  "",
                  "QKV Projection + A2A 建立同口径的 96-case benchmark、分离基线和 TE Userbuffers 对照；当前未优化实现有 38/96 个 p50 领先 TE Userbuffers，这组数据作为 v5 的优化起点，不作为 v4 的 SOTA 承诺。",
                  "",
                  "正式口径为 BF16、10 warmup + 50 samples、每个 sample 先取跨 rank 最大延迟再统计 p50/p95。NCCL 每个环境参数组合在独立 torchrun 进程中搜索，cuBLASLt 和 TE Userbuffers 分别完成结构与运行参数标定。",
                  "",
                  "复现入口、逐 case 表格和机器可读汇总分别位于两个算子目录下的 `BENCHMARK.md` 与 `results/`。",
                ].join("\n"),
              },
              "v5.0": {
                name: "v5.0 — benchmark launch and tuning release",
                body: [
                  "v5.0 固化 benchmark 的启动、计时和调参口径；A2A + OProj 与 QKV Projection + A2A 的生产热路径沿用 v4.0。",
                  "",
                  "两条算子都新增 Eager 与 CUDA Graph 两套正式结果。Graph 的 capture、instantiate 和显式 upload 位于采样之外；两列独立报告，不把启动方式之间的差值记作算子优化收益。",
                  "",
                  "QKV 正式 runner 改为 MPI 一进程一卡，通过 CUDA IPC 共享目标 buffer；单进程串行多卡 launch 仅保留作诊断。正式 10+50 Graph 使用单个预上传 graph、一次 replay 和 60 个单调 epoch kernel node。",
                  "",
                  "A2A + OProj 的 96-case Eager/Graph 对最强外部基线胜场分别为 95/96 与 94/96，CP8 两种口径均为 48/48。QKV 当前未专项优化实现对 TE Userbuffers 的胜场为 69/96 与 72/96，这组数据作为 v6 性能优化的固定起点。",
                  "",
                  "两个算子的 96-case 配置 manifest、TE/cuBLASLt+NCCL 与 TE Userbuffers winner、逐点 p50/p95/TFLOPS 和复现命令均已归档。",
                ].join("\n"),
              },
              "v6.0": {
                name: "v6.0 — QKV wave-time tile selection",
                body: [
                  "v6.0 首次优化 QKV Projection + A2A 热路径；A2A + OProj 沿用既有 Golden。",
                  "",
                  "QKV 运行时在 M128N128、M128N160、M128N256 cluster-M2 与 M128N320 cluster-M2 中选择。评分只使用 persistent wave 数与同 policy 的 H200 整波实测时间，不保存逐 shape winner，也不使用 TE Userbuffers 数据。",
                  "",
                  "整波标定覆盖 132 SM、comm_ctas=24/32 与 K=2048/3072/4096/5120/16384；超出设备、通信预算、K 或 peer-interleaved 标定域时自动回退 v5 策略。40 行原始标定、默认/手工 policy 入口与复现命令均已归档。",
                  "",
                  "🩵 **96 点相对 v5 的 p50 几何平均提升为 Eager 1.0155×、Graph 1.0164×；23 个实际换 tile 的 setting 分别为 1.0649× 与 1.0688×。**",
                  "",
                  "对 TE Userbuffers 的胜场由 69/96、72/96 增至 73/96、74/96；对最强外部基线由 63/96、68/96 增至 64/96、69/96。已知 CP4 人工中型 S=4K 会从快于 TE 变为慢于 TE，结果表明确保留该取舍，没有加入逐 shape 特判。",
                  "",
                  "正式口径继续使用 MPI 一进程一卡、10 warmup + 50 samples、逐样本 max-rank p50/p95，并分别报告 Eager 与 CUDA Graph。",
                ].join("\n"),
              },
              "v7.0": {
                name: "v7.0 — QKV joint pipeline policy",
                body: [
                  "v7.0 收口 QKV Projection + A2A 的联合流水策略；A2A + OProj 热路径沿用既有 Golden。",
                  "",
                  "运行时在启动前联合选择 `comm_ctas=4..32` 与 `M128N128/N160/N192/N256/N320`。评分只读取 M/N/K、CP/head geometry、SM 数、远端字节数、tile/cluster 几何和 H200 原语标定，不读取模型名、逐 shape winner 或 TE 结果。",
                  "",
                  "新增 `M128N192 cluster1` 保留 CTA 独立前进；跨 rank finalize 改为一个 warp 并行发布和等待 source epoch，内存序与退出语义保持不变。所有 96 个 setting 使用统一的 `comm_ctas=0/raster=n/swizzle=1` 自动入口。",
                  "",
                  "🩵 **相对 TE Userbuffers，Eager/Graph 均为 96/96 胜场，96 点 p50 几何平均分别领先 1.268× 与 1.319×；相对 v6 分别提升 1.147× 与 1.156×。**",
                  "",
                  "对 `min(TE Userbuffers, 最强 TE/cuBLASLt+NCCL 分离方案)`，Eager/Graph 胜场为 93/96 与 96/96，几何平均为 1.201× 与 1.250×。融合 GEMM-equivalent 吞吐达到经典 cuBLAS 的中位数为 Eager 90.8%、Graph 92.0%。",
                  "",
                  "正式口径为 BF16、MPI 一进程一卡、10 warmup + 50 samples、每个 sample 先取跨 rank 最大延迟再统计 p50/p95；Eager 与 CUDA Graph 分列。完整逐点表、纯 cuBLAS 吞吐对照和复现命令均已归档。",
                ].join("\n"),
              },
            };

            const release = releases[tag];
            if (!release) {
              core.setFailed(`No curated release notes for ${tag}`);
              return;
            }

            let existing = null;
            try {
              existing = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }

            if (existing) {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: existing.data.id,
                tag_name: tag,
                name: release.name,
                body: release.body,
                draft: false,
                prerelease: false,
              });
            } else {
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: release.name,
                body: release.body,
                draft: false,
                prerelease: false,
              });
            }
