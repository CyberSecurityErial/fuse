name: Publish annotated tags

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Annotated tag to publish
        required: true
        default: v19.0

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish GitHub release
        uses: actions/github-script@v7
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        with:
          github-token: ${{ github.token }}
          script: |
            const tag = context.ref.startsWith("refs/tags/")
              ? context.ref.slice("refs/tags/".length)
              : (process.env.REQUESTED_TAG || "v19.0");

            const releases = {
              "v19.0": {
                name: "v19.0 — SM103 BF16 forward and backward baseline",
                body: [
                  "Ships BF16 QKV and OProj forward/backward entry points on Blackwell SM103. Forward behavior is inherited from v18.0; the cancelled QKV forward-autotune experiment is excluded.",
                  "Adds persistent reverse routes, NN data gradients and TN local weight gradients, including immediate/deferred B/W interfaces. Local dW does not include cross-CP reduction; special MLA/KDA/gated routing remains TODO.",
                  "Integrates per-shape offline GEMM winners through explicit N256, epilogue and raster/swizzle settings. Communication stays at 16 CTAs in the comparison; ready indexing and output routing follow the selected tile. Default settings retain the original baseline.",
                  "Graph 10+50 with complete two-payload numerical/routing validation: 20 unique matrices / 23 logical fused A/B points. Fifteen paired points are stable, with +19.64% geometric-mean throughput; eight remain unstable after one retry. Known production_qwen_dense OProj CP4/256K regression: -6.7%.",
                  "Final results only: 1080 pure-cuBLASLt backward rows, the 540-row final fused catalog, configurations and validity under results/sm103/v19.0. Memory and unsupported-route gaps stay explicit. No candidate history, raw samples, profiles, dependencies or intermediate sweep packages.",
                  "This is a BF16 baseline release, not a claim that every projection route is implemented or every large shape has a valid measurement. MXFP8 is subsequent work.",
                ].join("\n"),
              },
              "v18.0": {
                name: "v18.0 — SM103 OProj runtime CTA autotune",
                body: [
                  "Adds runtime communication-CTA selection from independent GEMM/COPY services and the actual production/consumption schedule, with a physical-request cache. No model names or per-shape winner lookup.",
                  "Public auto mode keeps GEMM tile/raster/swizzle fixed: num_comm_ctas=0 selects a calibrated budget, positive budgets retain explicit behavior. Joint GEMM/CTA planning remains TODO; unsupported calibration requests are rejected. SM90, QKV and device synchronization are unchanged.",
                  "Five large models, 128K–512K, CP4/8: 23/30 cells, 46 A/B runs pass full two-payload numerical/routing validation. Seven historical missing cells remain blank.",
                  "Graph 1+5 quick screening: Auto versus v17-final configurations replayed on the same v18 binary is -1.21% geometric mean; 85.28% of historical full-148-SM pure cuBLASLt throughput. Known Qwen3 CP8/512K regression: -10.62% with 32 to 48 communication CTAs. Seven cells have >5% sample drift; no formal 10+50 or per-point optimality claim.",
                  "Auto versus earliest comparable historical archives (Llama v14, other models v16): +11.46% geometric mean, 20 improvements and 3 regressions. This historical comparison is not a same-session A/B.",
                  "Complete colored table, explicit/auto configurations, compact raw samples and evidence hashes: results/sm103/v18.0. No profiles, dependencies or intermediate sweep packages.",
                ].join("\n"),
              },
              "v17.0": {
                name: "v17.0 — SM103 OProj scheduling and offline tuning baseline",
                body: [
                  "OProj delivery order follows the actual GEMM raster/swizzle and compute budget; complete (M,peer) ready semantics are preserved.",
                  "Adds independent C/R calibration, budget-matched GEMM diagnostics and an offline production/consumption model. Runtime automatic tile/CTA selection remains TODO; configurations are explicit.",
                  "Five large models, 128K–512K, CP4/8: 23/30 cells pass full two-payload numerical/routing validation; memory-limited and historical missing cells remain blank.",
                  "Graph 1+5 quick screening, measured selection from model Top2: +15.77% geometric-mean throughput versus the same-run incumbent communication budget; 85.83% of historical full-SM pure cuBLASLt throughput. Five cells have >5% sample drift. Not formal 10+50, a runtime Top1 result, or a v16-to-v17 paired speedup.",
                  "SM90 unchanged. No new full-matrix QKV performance claim. Tables, explicit configurations, compact raw samples and evidence hashes: results/sm103/v17.0; no profiles, dependencies or intermediate sweep packages.",
                ].join("\n"),
              },
              "v16.0": {
                name: "v16.0 — Large-model long-sequence benchmarks",
                body: [
                  "Benchmark-only release: SM90/SM103 operator implementation is unchanged from v15.0.",
                  "BF16 Graph, 64K–512K, CP4/8: 56/80 fused cells, 336 finite candidates; 24 unsupported/deferred/memory-limited cells remain blank.",
                  "Primary comparison is same-M/N/K pure cuBLASLt; existing TEUB/NCCL references retained. Throughput retention is not hardware-peak MFU.",
                  "Adds pinned projection catalog and independent QKV/OProj harness resources; does not implement KDA/MLA special routing.",
                  "Tables, winner configurations, selected raw samples and evidence hashes: results/sm103/v16.0. No profiles, dependencies or intermediate sweep packages.",
                ].join("\n"),
              },
              "v15.0": {
                name: "v15.0 — Optional SM103 QKV rank swizzle",
                body: [
                  "新增 SM103 BF16 QKV rank N-band 错峰构建选项 FUSE_SM103_QKV_RANK_SWIZZLE，默认 OFF；不是运行时自动调优。",
                  "",
                  "GEMM 生产者与 TMA 消费者共同按源 rank 轮转 N 分组，不改变 head 归属、输出布局、ready 信号或发布/获取/排空协议。SM90 算法与公开参数布局不变。",
