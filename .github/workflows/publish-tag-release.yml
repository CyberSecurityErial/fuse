              "v14.0": {
                name: "v14.0 — Blackwell SM103 BF16 baseline",
                body: [
                  "B300 / SM103a 首版 BF16 前向融合基线：自研 QKVProj→A2A、A2A→OProj，CUTLASS Blackwell GEMM、持久化 CTA 角色特化、GMEM ready 同步和宏控制 profiling。",
                  "",
                  "源码、CMake 与 benchmark 按 SM90/SM103 分桶，保留历史路径兼容入口。QKV TMA 消费顺序按 producer/ready/copy 三种粒度协同，消除逻辑顺序错位引起的队头阻塞；并发完成仍需 acquire 全部依赖，没有添加全局完成屏障。",
                  "",
                  "Graph 全量 190/192 项通过；Llama405B CP4 512K 两方向因现有显存余量不足留空。随机输入、至少10+50、每个样本取 max-rank，生产与 profile 结果分开。",
