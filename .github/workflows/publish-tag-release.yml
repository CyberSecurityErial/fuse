                  "",
                  "本版是固定配置的 BF16 基线，不包含 SM103 低精度融合、backward 或异构 CP。完整 Graph 表、配置、max-rank 样本与证据哈希位于 results/sm103/v14.0；不附带大 profile、离线依赖或临时调优文件。",
