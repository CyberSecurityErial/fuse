                  "",
                  "默认路径 Perfetto 导出增加src_gpu/dst_gpu/route_peer/bytes；S2G源读取完成不等于远端到达。rank错峰与profiling同时开启暂不支持，配置阶段明确拒绝。",
                  "",
                  "完整对照表、配置、原始max-rank样本及证据哈希见results/sm103/v15.0；不附带大profile、依赖包或中间调优文件。",
                ].join("\n"),
